<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web scraping in practice · FlyRank</title>
<style>
  :root{
    --bg:#0A2426; --card:#102E2F; --card2:#16393A; --ink:#071A1C;
    --acc:#6CDD9B; --txt:#F1F1F1; --mut:#9FB8B2;
    --warn:#F9C74F; --err:#F97066; --blue:#8AB4F8;
    --side:240px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; overflow:hidden;}
  .mono{font-family:'Cascadia Code','Fira Code',Consolas,monospace;}
  button{cursor:pointer; border:none; border-radius:8px; font-weight:700; font-family:inherit;}
  #app{display:flex; height:100vh;}
  #side{width:var(--side); min-width:var(--side); background:var(--ink); padding:16px 0; overflow-y:auto; border-right:1px solid var(--card2); transition:margin .25s;}
  #side.hidden{margin-left:calc(var(--side) * -1);}
  #side .brand{padding:0 16px 12px; border-bottom:1px solid var(--card2); margin-bottom:10px;}
  #side .brand .fr{font-size:17px; font-weight:800; color:#fff;}
  #side .brand .fr span{color:var(--acc);}
  #side .brand .wk{font-size:10px; color:var(--mut); letter-spacing:.18em; text-transform:uppercase; margin-top:2px;}
  #side .chap{font-size:9.5px; letter-spacing:.2em; color:var(--acc); text-transform:uppercase; font-weight:700; padding:12px 16px 4px;}
  #side a{display:block; padding:5px 16px 5px 22px; color:var(--mut); text-decoration:none; font-size:13px; border-left:3px solid transparent; line-height:1.35;}
  #side a:hover{color:var(--txt); background:var(--card);}
  #side a.on{color:var(--acc); border-left-color:var(--acc); background:var(--card); font-weight:600;}
  #main{flex:1; display:flex; flex-direction:column; min-width:0;}
  #topbar{display:flex; align-items:center; gap:10px; padding:10px 18px; border-bottom:1px solid var(--card2);}
  #topbar .tb{background:var(--card); color:var(--mut); padding:6px 12px; font-size:12px;}
  #topbar .tb:hover{color:var(--txt);}
  #resbtn .cnt{display:inline-block; background:var(--acc); color:var(--ink); border-radius:9px; font-size:10px; font-weight:800; padding:1px 7px; margin-left:6px; vertical-align:1px;}
  #counter{margin-left:auto; color:var(--mut); font-size:12px;}
  #progress{height:3px; background:var(--card);}
  #bar{height:100%; width:0; background:var(--acc); transition:width .25s;}
  #stage{flex:1; overflow-y:auto; padding:28px 40px;}
  #notes{display:none; border-top:1px solid var(--card2); background:var(--ink); padding:10px 18px; font-size:12.5px; color:var(--mut); max-height:22vh; overflow-y:auto;}
  #notes.show{display:block;}
  #notes b{color:var(--acc);}
  #navbtns{position:fixed; right:18px; bottom:16px; display:flex; gap:8px; z-index:5;}
  #navbtns button{background:var(--card2); color:var(--txt); width:40px; height:40px; font-size:16px; border-radius:50%;}
  #navbtns button:hover{background:var(--acc); color:var(--ink);}
  .slide{display:none; max-width:1220px; margin:0 auto; animation:fade .25s;}
  .slide.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1;}}
  .kick{display:flex; align-items:center; gap:9px; color:var(--acc); font-weight:700; letter-spacing:.24em; font-size:11px; text-transform:uppercase; margin-bottom:8px;}
  .kick::before{content:""; width:11px; height:11px; background:var(--acc);}
  h1.st{font-size:clamp(26px,3.4vw,40px); color:#fff; margin-bottom:8px; line-height:1.2;}
  .sub{color:var(--mut); font-size:16px; margin-bottom:20px;}
  .cards{display:grid; gap:14px; margin:14px 0;}
  .c2{grid-template-columns:1fr 1fr;} .c3{grid-template-columns:1fr 1fr 1fr;} .c4{grid-template-columns:repeat(4,1fr);}
  .card{background:var(--card); border-radius:12px; padding:16px; border:1.5px solid transparent;}
  .card.hl{border-color:var(--acc);} .card.err{border-color:var(--err);} .card.wrn{border-color:var(--warn);}
  .card h3{font-size:16px; margin-bottom:6px;}
  .card h3.g{color:var(--acc);} .card h3.y{color:var(--warn);} .card h3.r{color:var(--err);}
  .card p{font-size:14.5px; color:var(--txt); line-height:1.5;}
  .card .cap{color:var(--mut); font-size:13px;}
  .strip{background:var(--card2); border-radius:10px; padding:12px 16px; font-size:15px; margin:14px 0; line-height:1.55;}
  .strip b{color:var(--acc);}
  .strip.warn b{color:var(--warn);}
  .bl{font-size:15px; color:var(--mut); margin-top:14px; line-height:1.55;}
  .bl b{color:var(--txt);} .bl .g{color:var(--acc); font-weight:700;}
  .ink{background:var(--ink); border-radius:10px; padding:14px 16px; font-size:14.5px; line-height:1.7; white-space:pre-wrap;}
  .ok{color:var(--acc);} .bad{color:var(--err);} .mid{color:var(--warn);} .dim{color:var(--mut);} .blu{color:var(--blue);}
  .ico{font-size:26px; margin-bottom:6px;}
  .arrowflow{display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center; margin:10px 0;}
  .arrowflow .ar{color:var(--acc); font-size:20px;}
  .pill{display:inline-block; background:var(--ink); border-radius:6px; padding:3px 9px; font-size:12px; color:var(--txt);}
  table.tt{border-collapse:collapse; width:100%; font-size:13.5px; margin:10px 0;}
  table.tt th{background:var(--card2); color:var(--acc); text-align:left; padding:7px 10px; font-size:11.5px;}
  table.tt td{background:var(--card); padding:7px 10px; border-top:2px solid var(--bg); vertical-align:top;}
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;}
  .dg{background:var(--acc);} .dy{background:var(--warn);} .dr{background:var(--err);}
  .btn{background:var(--acc); color:var(--ink); padding:8px 18px; font-size:13.5px;}
  .btn.ghost{background:var(--card2); color:var(--txt);}
  .infobox{background:var(--card2); border-left:4px solid var(--acc); border-radius:8px; padding:12px 14px; min-height:64px; font-size:15px; line-height:1.55;}
  .infobox b{color:var(--acc);}
  .q{background:var(--ink); border-radius:10px; padding:16px; margin-bottom:12px;}
  .q p{margin-bottom:10px; font-size:15px;}
  .opts{display:flex; gap:10px; flex-wrap:wrap;}
  .opt{background:var(--card2); color:var(--txt); padding:8px 16px; font-size:14px;}
  .opt.right{background:var(--acc); color:var(--ink);}
  .opt.wrong{background:var(--err); color:var(--ink);}
  .verdict{margin-top:8px; font-size:13.5px; min-height:18px; color:var(--mut);}
  .score{color:var(--acc); font-weight:700;}
  .netrow{display:flex; gap:12px; align-items:center; background:var(--card); padding:8px 12px; border-radius:8px; margin-bottom:6px; cursor:pointer; font-size:13.5px; border:1.5px solid transparent; font-family:'Cascadia Code',Consolas,monospace;}
  .netrow:hover{border-color:var(--card2);}
  .netrow.sel{border-color:var(--acc);}
  .netrow .typ{font-size:11px; color:var(--mut); min-width:78px; text-align:right;}
  .netrow.data .nm{color:var(--acc); font-weight:700;}
  .netrow.hiddenrow{display:none;}
  .vgrid{display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start;}
  .vgrid label{display:block; font-size:12px; color:var(--mut); margin:8px 0 3px;}
  .vgrid input{width:100%; background:var(--ink); border:1.5px solid var(--card2); border-radius:8px; color:var(--txt); padding:8px 10px; font-size:14px; font-family:'Cascadia Code',Consolas,monospace;}
  .vgrid input:focus{outline:none; border-color:var(--acc);}
  #resdrawer{position:fixed; top:0; right:0; height:100%; width:400px; max-width:92vw; background:var(--ink); border-left:1px solid var(--card2); z-index:20; transform:translateX(105%); transition:transform .28s ease; display:flex; flex-direction:column; box-shadow:-12px 0 30px rgba(0,0,0,.35);}
  #resdrawer.open{transform:translateX(0);}
  #resdrawer .rhead{display:flex; align-items:center; gap:10px; padding:16px 18px 12px; border-bottom:1px solid var(--card2);}
  #resdrawer .rhead .rk{color:var(--acc); font-size:10px; letter-spacing:.22em; text-transform:uppercase; font-weight:700;}
  #resdrawer .rhead .rt{font-size:15px; font-weight:700; color:#fff;}
  #resdrawer .rhead button{margin-left:auto; background:var(--card2); color:var(--txt); width:30px; height:30px; border-radius:50%; font-size:14px;}
  #resbody{overflow-y:auto; padding:12px 16px 24px; flex:1;}
  .ritem{display:block; background:var(--card); border-radius:10px; padding:12px 14px; margin-bottom:10px; text-decoration:none; border:1.5px solid transparent; transition:border-color .15s;}
  .ritem:hover{border-color:var(--acc);}
  .ritem .rt1{font-size:14px; font-weight:700; color:var(--txt); margin-bottom:3px;}
  .ritem .rt1 .ext{color:var(--acc); font-size:11px; margin-left:5px;}
  .ritem .rm{font-size:12px; color:var(--mut); line-height:1.5;}
  .rleg{font-size:11.5px; color:var(--mut); padding:0 2px 10px; line-height:1.6;}
  .rempty{color:var(--mut); font-size:13px; padding:8px 2px;}
  @media(max-width:860px){ .c3,.c4{grid-template-columns:1fr 1fr;} #side{position:fixed; z-index:9; height:100%;} .vgrid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div id="app">
  <nav id="side"></nav>
  <div id="main">
    <div id="topbar">
      <button class="tb" id="tgSide">☰ Menu</button>
      <button class="tb" id="tgNotes">Notes (N)</button>
      <button class="tb" id="tgFull">Fullscreen (F)</button>
      <button class="tb" id="resbtn">📚 Resources (R)<span class="cnt" id="rescnt">0</span></button>
      <span id="counter"></span>
    </div>
    <div id="progress"><div id="bar"></div></div>
    <div id="stage"></div>
    <div id="notes"></div>
  </div>
</div>
<div id="navbtns"><button id="zin">+</button><button id="zout">−</button><button id="prev">←</button><button id="next">→</button></div>
<div id="resdrawer"><div class="rhead"><div><div class="rk">Resources for this slide</div><div class="rt" id="restitle"></div></div><button id="resclose">✕</button></div><div id="resbody"></div></div>

<script>
const CH = {A:"The map", B:"Permission first", C:"Find the data", D:"Build the pipeline", E:"Your move"};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const slides = [];
const S = (chapter, nav, kick, title, body, notes) => { slides.push({chapter, nav, kick, title, body, notes}); };

/* ── 1 · Welcome ── */
S(CH.A, "Welcome", "Backend Development Track · Standalone session", "Web scraping in practice", `
  <p class="sub">A lecture + 3 demos you can replay yourself · Every language welcome</p>
  <div class="strip"><b>One machine.</b> Your track so far: a door (the API), a brain (the service), shelves (the database). Today we add the missing box — <b>the intake</b>, where a system goes out and gets its data.</div>
  <div class="cards c3">
    <div class="card hl"><div class="ico">💡</div><h3 class="g">Why this topic?</h3><p class="cap">Not because every project scrapes — most never do. Because nothing shows you how the web really works faster: how pages fetch data, how pagination behaves, what status codes mean in practice, what tools like Playwright actually do.</p></div>
    <div class="card wrn"><div class="ico">⚖️</div><h3 class="y">The grey area, up front</h3><p class="cap">There is no "scraping law" — several rule-books apply at once: a site's terms, copyright, computer-access law, privacy law. Not legal advice; a habit instead: ask "may I?" before "how do I?".</p></div>
    <div class="card"><div class="ico">🆓</div><h3>Safe to practise</h3><p class="cap">Every target today is a public sandbox, built to be scraped. And everything is free — no credit card, no signup. That is a promise.</p></div>
  </div>
  <p class="bl">3 demos run inside these slides — replay them any time from the recording. Keys: <b>← →</b> move · <b>N</b> speaker notes · <b>R</b> resources · <b>F</b> fullscreen · <b>+/−</b> zoom.</p>`,
  "0:00 → 2:30. Open with the machine picture (door / brain / shelves — today we add the intake), then the WHY-THIS-TOPIC beat: picked not because scraping is essential, but because it is the fastest practical tour of how the web works — data fetching, pagination, status codes, browser tools. Then the grey-area disclaimer with the LinkedIn-case story (courts leaned 'public pages are not hacking', yet the scraper lost on the site's TERMS after ~6 years; privacy law protects even public personal data). Not legal advice. All targets are sandboxes. No agenda slide by design.");

/* ── 2 · A scraper is a client ── */
S(CH.A, "What a scraper is", "The map", "A scraper is a client", `
  <div class="cards c2">
    <div class="card"><div class="ico">🧑‍💻</div><h3>A browser</h3><p class="cap">Asks the server for a page. Shows the answer to a human. Then it forgets.</p></div>
    <div class="card hl"><div class="ico">🤖</div><h3 class="g">A scraper</h3><p class="cap">Asks the server the same way. Reads the answer with code. Keeps records.</p></div>
  </div>
  <div class="strip"><b>The whole web is one loop:</b> a client asks, a server answers. A scraper is one more client in that loop. Not a trick. Not a hack. A client that takes notes.</div>
  <p class="bl">In the restaurant picture from Week 2: the browser is a customer who eats the meal. The scraper is a customer who <b>writes down the menu</b>. Same door, same waiter, same rules of the house.</p>
  <p class="bl"><b>Bottom line</b> — <span class="g">a scraper is a polite client that keeps records.</span></p>`,
  "2:30 → 4:00. Callback to the W2 loop and the restaurant — shared vocabulary, do not re-teach it. For complete beginners this slide IS the definition of scraping. Chat prompt: 'Who has already tried to scrape something? One word: what site?'");

/* ── 3 · The pipeline ── */
S(CH.A, "The pipeline", "The map", "A scraper is one step, not the job", `
  <div class="arrowflow">
    <span class="pill">fetch</span><span class="ar">→</span>
    <span class="pill">extract</span><span class="ar">→</span>
    <span class="pill">normalize</span><span class="ar">→</span>
    <span class="pill">validate</span><span class="ar">→</span>
    <span class="pill">store</span><span class="ar">→</span>
    <span class="pill">report</span>
  </div>
  <div class="cards c3">
    <div class="card"><h3>Fetch + Extract</h3><p class="cap">Get the page. Pull out the fields. Most people build these two — and stop.</p></div>
    <div class="card"><h3>Normalize + Validate</h3><p class="cap">Give every record one clean shape. Reject garbage before you save it.</p></div>
    <div class="card"><h3>Store + Report</h3><p class="cap">Save without duplicates. Then say out loud what the run did.</p></div>
  </div>
  <div class="strip warn"><b>The worst failure is not a crash.</b> It is a job that returns 200 OK every night — and writes zero records. For three weeks. Nobody notices, because nothing "failed". We fix that today.</div>
  <p class="bl"><b>Bottom line</b> — <span class="g">six small functions in one file. That is the whole "pipeline". Nothing enterprise.</span></p>`,
  "4:00 → 6:30. This slide is the frame for the whole session — do not rush it. Say the six words out loud. Tease the silent-zero story, promise to return to it. Chat prompt: 'Which of the six do you skip today?' Bet on normalize and report.");

/* ── 4 · Ask before you scrape ── */
S(CH.B, "Classify the target", "Permission first", "Ask before you scrape", `
  <table class="tt">
    <tr><th>Target</th><th>Risk</th><th>What you do</th></tr>
    <tr><td><span class="dot dg"></span>A practice sandbox, built to be scraped</td><td>Low</td><td>Go. That is what it exists for. Rate limit anyway — you train the habit.</td></tr>
    <tr><td><span class="dot dy"></span>A public page, no login</td><td>Lower</td><td>Check first. Visible does not mean free to take. Read the terms. Take the minimum.</td></tr>
    <tr><td><span class="dot dr"></span>Behind a login or a paywall</td><td>High</td><td>Only with an allowed account and explicit approval from somebody senior.</td></tr>
    <tr><td><span class="dot dr"></span>Personal data — names, photos, employers</td><td>High</td><td>Stop and get advice. Public and unregulated are not the same word.</td></tr>
    <tr><td><span class="dot dr"></span>You were blocked — 403, challenge, hard limit</td><td>Stop</td><td>The block is the answer. Ask, find an official API, or find another source.</td></tr>
  </table>
  <div class="strip"><b>robots.txt</b> is a machine-readable <b>request</b> from a site to robots. It is not a law. It is also not a permission slip. Read it, respect it — and still answer the questions above.</div>
  <p class="bl"><b>Bottom line</b> — <span class="g">classify the target before you write the parser. It changes what you build.</span></p>`,
  "6:30 → 9:00. Not legal advice — say so: 'I am an engineer, not a lawyer, and this varies by country.' Top row is today's entire assignment scope. Spend your time on the bottom three rows. The robots.txt strip kills two opposite mistakes at once — name both.");

/* ── 5 · Sorter quiz ── */
S(CH.B, "Go, check, or stop?", "Permission first · Interactive", "Go, check, or stop?", `
  <p class="sub">Four real situations. Vote in the chat, then click the answer.</p>
  <div id="quiz">
    <div class="q" data-ans="0"><p><b>1.</b> A site advertised as a scraping practice sandbox, with 1000 fake books.</p>
      <div class="opts"><button class="opt">🟢 Go ahead</button><button class="opt">🟡 Check first</button><button class="opt">🔴 Stop</button></div>
      <div class="verdict" data-v="Go ahead. It exists for this. Keep volumes small and rate limit anyway — you practise the habit, not just the code."></div></div>
    <div class="q" data-ans="1"><p><b>2.</b> A public company blog, no login. You want article titles for a personal dashboard.</p>
      <div class="opts"><button class="opt">🟢 Go ahead</button><button class="opt">🟡 Check first</button><button class="opt">🔴 Stop</button></div>
      <div class="verdict" data-v="Check first. Public is the easy part. Read the terms, glance at robots.txt, take only what you need. Low risk is not no risk."></div></div>
    <div class="q" data-ans="2"><p><b>3.</b> A site returns 403 to your script. It works in your browser. You copy the browser headers to get past the block.</p>
      <div class="opts"><button class="opt">🟢 Go ahead</button><button class="opt">🟡 Check first</button><button class="opt">🔴 Stop</button></div>
      <div class="verdict" data-v="Stop. The 403 IS the answer. Copying headers to defeat a block is evasion, not engineering. This is how IP ranges get banned."></div></div>
    <div class="q" data-ans="2"><p><b>4.</b> Public profile pages with people's names, photos and employers. You want to build a dataset.</p>
      <div class="opts"><button class="opt">🟢 Go ahead</button><button class="opt">🟡 Check first</button><button class="opt">🔴 Stop</button></div>
      <div class="verdict" data-v="Stop — and get advice. This one catches good engineers. Personal data has its own rules, no matter how visible the page is."></div></div>
  </div>
  <p class="bl" id="qscore">Score: <span class="score">0 / 4</span> — click one answer per situation.</p>`,
  "9:00 → 12:00. Run with the room: read a scenario, take chat votes, then click. Scenario 4 splits rooms — most say 'check first'; slow down on the reveal. Running long? Do 1 and 3 only, tell people the rest are clickable in the recording. After this slide: 'From here on, pure technique.'");

/* ── 6 · Four places data lives ── */
S(CH.C, "Four places", "Find the data", "One page, four places the data can be", `
  <div class="cards c4">
    <div class="card hl"><div class="ico">📄</div><h3 class="g">1 · Initial HTML</h3><p class="cap">The text the server sent. Check with Ctrl+U. If your value is here — you are done. Cheapest and most stable.</p></div>
    <div class="card"><div class="ico">📦</div><h3>2 · Embedded JSON</h3><p class="cap">A script tag that holds data, not code: ld+json, "var data = [...]", __NEXT_DATA__. Often cleaner than the visible page.</p></div>
    <div class="card"><div class="ico">🔌</div><h3>3 · The page's own endpoint</h3><p class="cap">The page's JavaScript calls a URL and gets JSON back. Same data, no HTML in the middle.</p></div>
    <div class="card wrn"><div class="ico">🖥️</div><h3 class="y">4 · Rendered DOM only</h3><p class="cap">The value exists only after JavaScript runs. Now — and only now — you need a real browser.</p></div>
  </div>
  <div class="strip warn"><b>Two different documents.</b> Ctrl+U (view source) shows what the server <b>sent</b>. The Elements panel shows the page <b>after JavaScript ran</b>. Write a selector from Elements, run it on the download — it matches nothing, and you lose an hour.</div>
  <p class="bl"><b>Try this later:</b> open any product page, press Ctrl+U, search for the price. About half the time it sits in a JSON-LD block — already structured, already typed.</p>
  <p class="bl"><b>Bottom line</b> — <span class="g">the visible page is a rendering layer. Stay as far left in this row as you can.</span></p>`,
  "12:00 → 15:00. The most practically useful slide of the session. Walk the four cards left to right; left = kilobytes, right = a whole Chromium process. Say the view-source vs Elements distinction TWICE — it is the number one silent time-waster for beginners.");

/* ── 7 · Three questions ── */
S(CH.C, "The triage", "Find the data", "Ask three questions, in order", `
  <table class="tt">
    <tr><th>#</th><th>Question</th><th>How you check</th><th>If yes</th></tr>
    <tr><td>1</td><td>Is the data in the initial HTML?</td><td>Ctrl+U, then Ctrl+F for a value you can see</td><td>One HTTP request + an HTML parser. Done.</td></tr>
    <tr><td>2</td><td>Is it in a script tag as JSON?</td><td>Same view-source. Search "ld+json", "var data", "__NEXT_DATA__"</td><td>One HTTP request + JSON.parse. Done.</td></tr>
    <tr><td>3</td><td>Does the page fetch it from its own endpoint?</td><td>DevTools → Network → Fetch/XHR → reload or scroll</td><td>One HTTP request to that endpoint. Done.</td></tr>
    <tr><td>—</td><td>All three are no?</td><td>The value appears only after JavaScript paints it</td><td><i>Then</i> a real browser.</td></tr>
  </table>
  <div class="strip"><b>The first yes wins.</b> You are not looking for the best answer. You are looking for the cheapest answer that is correct. When a question says yes — stop searching, start building.</div>
  <p class="bl"><b>Bottom line</b> — <span class="g">option 1 costs a few kilobytes. Option 4 costs a whole browser process, per page.</span></p>`,
  "15:00 → 17:00. This table is Stage 0 of the practice assignment — say that out loud: 'You will do exactly this on three real pages, with no code. Just Ctrl+U, DevTools, and a text file.' Keep this slide brisk; the next demo shows question 3 live.");

/* ── 8 · Network panel simulator ── */
S(CH.C, "Watch the network", "Find the data · Interactive", "Find the request behind the page", `
  <div class="cards c2" style="align-items:start;">
    <div>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <button class="btn ghost" id="netAll">All</button>

    const m = price.match(/^([£$€])\s*([0-9]+(?:\.[0-9]+)?)$/);
    if (m) { currency = {"£":"GBP","$":"USD","€":"EUR"}[m[1]]; amount = parseFloat(m[2]); }
    else errs.push('price: no currency symbol found in "' + price + '" — a bare number is not a price.');
    const rnum = WORDS[rating];
    if (!rnum) errs.push('rating: "' + rating + '" is not one of One, Two, Three, Four, Five.');
    const am = avail.match(/in stock(?:\s*\((\d+) available\))?/i);
    const inStock = !!am, count = am && am[1] ? +am[1] : null;
    if (!am) errs.push('availability: "' + avail + '" did not match a known pattern.');
    let url = null;
    try { url = new URL(href, "https://books.toscrape.com/catalogue/page-1.html").href; }
    catch(e){ errs.push('href: could not resolve "' + href + '" to an absolute URL.'); }
    if (errs.length) {
      out.innerHTML = '<span class="bad">✕ QUARANTINED — not saved with the good records.</span>\n<span class="dim">The run did not crash. The other 59 records are fine.</span>\n\nReasons:\n' + errs.map(e => '<span class="mid">• ' + esc(e) + '</span>').join('\n');
    } else {
      out.innerHTML = '<span class="ok">✓ VALID — saved.</span>\n{\n  "canonical_url": <span class="blu">"' + url + '"</span>,\n  "price": { "amount": <span class="ok">' + amount + '</span>, "currency": "' + currency + '" },\n  "rating": <span class="ok">' + rnum + '</span>,\n  "in_stock": <span class="ok">' + inStock + '</span>' + (count !== null ? ', "count": <span class="ok">' + count + '</span>' : '') + ',\n  "raw": { "price_text": "' + esc(P('vPrice').value) + '", "rating_text": "' + esc(rating) + '" }\n}\n<span class="dim">Raw and clean live side by side. Provenance untouched.</span>';
    }
  }
  P('vGo').onclick = run;
  P('vBreak').onclick = () => { P('vPrice').value = "51.77"; P('vRating').value = "3 stars"; run(); };
  P('vReset').onclick = () => { for (const k in DEF) P(k).value = DEF[k]; out.innerHTML = '<span class="dim">Press "Normalize &amp; validate" to run the record through the schema.</span>'; };
})();
